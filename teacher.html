<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Бинго: рационал сандар</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1d2433; --muted:#6b7488; --line:#dfe3ee;
  --a:#3b4fd8;      /* accent 1: indigo */
  --a-soft:#e6e9fb;
  --b:#f28c1e;      /* accent 2: orange */
  --b-soft:#fff0dc;
  --bad:#c0392b; --ok:#1f8f55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(circle at 50% -10%,#e3e7ff 0,var(--bg) 55%) fixed;color:var(--ink);font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font-family:inherit}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:14px 14px 28px}
h1{font-size:19px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.lang{display:flex;border:2px solid var(--a);border-radius:10px;overflow:hidden}
.lang button{border:0;background:#fff;color:var(--a);font-size:16px;font-weight:700;padding:8px 14px}
.lang button.on{background:var(--a);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.muted{color:var(--muted);font-size:15px}
label{display:block;font-weight:700;margin-bottom:8px;font-size:18px}
input.text{width:100%;font-size:22px;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input.text:focus{outline:none;border-color:var(--a)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:20px;font-weight:700;background:var(--a);color:#fff}
.btn:active{opacity:.85}
.btn:disabled{background:#c9cde0;color:#fff}
.btn.alt{background:var(--b)}
.btn.ghost{background:#fff;color:var(--a);border:2px solid var(--a)}
.btn.small{font-size:16px;padding:12px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* bingo grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;border:3px solid var(--line);border-radius:16px;background:#fff;font-size:40px;font-weight:800;color:var(--ink);position:relative;user-select:none}
.cell.sel{border-color:var(--a);background:var(--a-soft)}
.cell.empty{color:#c0c5d6;font-weight:600}
.cell.done{background:var(--a);border-color:var(--a);color:#fff}
.cell.done::after{content:"✓";position:absolute;top:4px;right:9px;font-size:20px;color:#fff;opacity:.9}
.cell.line{background:var(--b);border-color:var(--b)}
.cell.locked{cursor:default}

/* number chips */
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chip{border:2px solid var(--a);background:#fff;color:var(--a);border-radius:12px;padding:12px 0;font-size:20px;font-weight:700}
.chip:disabled{border-color:var(--line);color:#c0c5d6;background:#f1f2f7}

/* keypad */
.fields{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-bottom:10px}
.field{border:3px solid var(--line);border-radius:14px;background:#fff;padding:4px 12px;min-height:68px}
.field.act{border-color:var(--a);background:var(--a-soft)}
.field small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.field b{font-size:32px;display:block;min-height:38px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{border:0;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:26px;font-weight:700;padding:10px 0;color:var(--ink)}
.key:active{background:var(--a-soft)}
.key.minus{background:var(--b-soft);border-color:var(--b);color:#b35d00}
.key.del{background:#f1f2f7}
.msg{border-radius:14px;padding:14px;font-size:19px;font-weight:700;margin-bottom:10px}
.msg.ok{background:#e3f5ea;color:var(--ok)}
.msg.warn{background:var(--b-soft);color:#a45500}
.msg.bad{background:#fbe6e3;color:var(--bad)}
.stat{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin:8px 2px}
.you{font-size:20px;font-weight:800}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(20,26,50,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:400px;text-align:center;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:26px}
.modal p{font-size:18px;margin:8px 0 18px}
.win{background:linear-gradient(160deg,var(--a),#6a78ee);color:#fff}
.win .big{font-size:72px;font-weight:900;letter-spacing:1px;line-height:1;margin:8px 0}
.win .nm{font-size:30px;font-weight:800}
.win .sub{font-size:20px;margin:10px 0 4px}
.win .tm{font-size:17px;opacity:.9;margin-bottom:18px}
.win .btn{background:#fff;color:var(--a)}
.win.full{background:linear-gradient(160deg,var(--b),#f5ae4d)}
.win.full .btn{color:#b35d00}

/* teacher */
.t-task{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 12px;text-align:center;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:12px}
.t-num{font-size:30px;font-weight:800;color:var(--a);margin-bottom:10px}
.t-expr{font-size:64px;font-weight:700;line-height:1.3;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 4px}
.t-ans{margin-top:14px;font-size:56px;font-weight:900;color:var(--b)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-size:.8em;line-height:1.15}
.fr span:first-child{border-bottom:.08em solid currentColor;padding:0 .2em}
.fr span:last-child{padding:0 .2em}
.sw{display:flex;gap:8px;margin-bottom:12px}
.sw button{flex:1;border:2px solid var(--a);background:#fff;color:var(--a);border-radius:12px;padding:12px 4px;font-size:15px;font-weight:700}
.sw button.on{background:var(--a);color:#fff}
.t-wide .t-expr{font-size:min(9vw,84px)}
@media (min-width:700px){#app.teacher{max-width:900px}.t-expr{font-size:96px}.t-ans{font-size:80px}}
.hidden{display:none!important}

/* slides */
.slide{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 14px;min-height:48vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;margin-bottom:12px}
.slide h2{font-size:clamp(26px,4.2vw,48px);margin:0}
.slide p{font-size:clamp(19px,2.6vw,32px);margin:0;max-width:900px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,320px)}
.mc{aspect-ratio:4/3;border:3px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;background:#fff}
.mc.d{background:var(--a);color:#fff;border-color:var(--a)}
.mc.h{background:var(--b);border-color:var(--b);color:#fff}
.two{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}.two .mg{width:min(42vw,230px)}.cap{font-weight:900;color:var(--muted)}
.chips.wide{width:100%;max-width:900px}
@media (min-width:700px){.chips.wide{grid-template-columns:repeat(11,1fr)}.mc{font-size:44px}.mg{width:360px}}
.qr{width:min(64vw,340px,34vh);background:#fff;line-height:0}.qr svg{width:100%;height:auto;display:block}
.urlin{max-width:760px;font-size:clamp(18px,3vw,34px);text-align:center}
.nav{display:flex;gap:10px;align-items:center}.nav .btn{width:auto;flex:1}
.dots{display:flex;gap:6px}.dots span{width:11px;height:11px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--a)}
.two .mg{width:min(42vw,230px)!important}
/* game feel */
h1{color:var(--a);font-weight:900;letter-spacing:-.2px}
.btn{box-shadow:0 5px 0 rgba(20,26,60,.22);transition:transform .08s,box-shadow .08s;text-transform:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(20,26,60,.22);opacity:1}
.btn:disabled{box-shadow:0 5px 0 #aeb3c9}
.key{box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip{box-shadow:0 3px 0 #c5cbf2}.chip:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #c5cbf2}
.cell{box-shadow:0 5px 0 var(--line)}
.cell.done{box-shadow:0 5px 0 #25329a}.cell.line{box-shadow:0 5px 0 #b86a0c;animation:pulse 1.1s ease-in-out infinite}
.cell.fresh{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.5) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.msg{animation:slideIn .25s ease-out}.msg.bad{animation:shake .4s}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.bar{height:16px;background:#dfe3fa;border-radius:10px;overflow:hidden;margin:0 0 10px;box-shadow:inset 0 2px 3px rgba(20,26,60,.12)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:10px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.modal{animation:zoom .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes zoom{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.win .big{animation:wob 1.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.06)}}
.slide>*{animation:fadeUp .4s ease-out both}.slide>*:nth-child(2){animation-delay:.08s}.slide>*:nth-child(3){animation-delay:.16s}.slide>*:nth-child(4){animation-delay:.24s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== ARCADE THEME ===== */
:root{--bg:#0d0a2b;--card:#17134a;--ink:#f3f0ff;--muted:#a9a2e6;--line:#322c85;--a:#19e3ff;--a-soft:#12306e;--b:#ffcf33;--b-soft:#3b3010;--bad:#ff5d7a;--ok:#35f2a0}
html,body{background:#0d0a2b;color:var(--ink)}
body{background:radial-gradient(circle at 15% -10%,#3a1d8f 0,transparent 45%),radial-gradient(circle at 95% 105%,#0b5a8f 0,transparent 42%),#0d0a2b;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.6px);background-size:34px 34px;pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
h1{color:var(--a);font-size:14px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(25,227,255,.7)}
.snd{background:#0a0720;border:2px solid var(--line);border-radius:12px;font-size:20px;padding:6px 10px;color:var(--ink)}
.logo{font-size:68px;font-weight:900;letter-spacing:6px;text-align:center;color:var(--b);text-shadow:0 5px 0 #a56a00,0 0 28px rgba(255,207,51,.75);margin:18px 0 0;animation:logoGlow 2.2s ease-in-out infinite}
.logo-sub{text-align:center;color:var(--a);font-weight:800;letter-spacing:4px;text-transform:uppercase;margin-bottom:18px;text-shadow:0 0 10px rgba(25,227,255,.6)}
@keyframes logoGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.card{background:var(--card);border:2px solid var(--line);color:var(--ink);box-shadow:0 0 24px rgba(25,227,255,.08)}
.muted{color:var(--muted)}
label{color:var(--ink)}
input.text{background:#0a0720;border:3px solid var(--line);color:var(--ink)}
input.text:focus{border-color:var(--a);box-shadow:0 0 14px rgba(25,227,255,.5)}
input.text::placeholder{color:#6a63c9}
.btn{background:linear-gradient(#ffe066,#ffb703);color:#2a1a00;font-weight:900;letter-spacing:.6px;text-transform:uppercase;box-shadow:0 6px 0 #a56a00,0 0 20px rgba(255,207,51,.35)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a56a00,0 0 20px rgba(255,207,51,.35)}
.btn.alt{background:linear-gradient(#6af2ff,#12b8d6);color:#032a33;box-shadow:0 6px 0 #0a7186,0 0 20px rgba(25,227,255,.35)}
.btn.alt:active{box-shadow:0 1px 0 #0a7186,0 0 20px rgba(25,227,255,.35)}
.btn.ghost{background:transparent;color:var(--a);border:2px solid var(--a);box-shadow:0 4px 0 #0b3f5a}
.btn.ghost:active{box-shadow:0 0 0 #0b3f5a}
.btn:disabled{background:#2c2766;color:#7b74c8;border-color:#3a3490;box-shadow:0 5px 0 #14103c}
.btn.pulse{animation:btnpulse 1.3s ease-in-out infinite}
@keyframes btnpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.hud{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#0a0720;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px;letter-spacing:.6px}
.pill.lv{border-color:var(--a);color:var(--a)}.pill.xp{border-color:var(--b);color:var(--b)}.pill.cb{border-color:#ff7a59;color:#ff9b7a;animation:pulse 1s infinite}
.stat{color:var(--ink)}
.bar{background:#0a0720;border:2px solid var(--line);box-shadow:none}
.bar i{background:linear-gradient(90deg,var(--a),var(--b))}
.cell{background:#1c1760;border:3px solid #3e37a0;color:var(--ink);box-shadow:0 6px 0 #0a0720,inset 0 0 0 2px rgba(255,255,255,.06)}
.cell.sel{border-color:var(--a);background:var(--a-soft);box-shadow:0 6px 0 #0a0720,0 0 18px rgba(25,227,255,.55)}
.cell.empty{color:#6a63c9}
.cell.done{background:radial-gradient(circle at 35% 28%,#fff3b0,#ffcf33 55%,#e09a00);color:#3a2300;border-color:#ffe38a;box-shadow:0 6px 0 #8a5a00,0 0 20px rgba(255,207,51,.6)}
.cell.done::after{color:#3a2300;opacity:.8}
.cell.line{background:radial-gradient(circle at 35% 28%,#e9fdff,#6af2ff 50%,#12b8d6);color:#032a33;border-color:#c9fbff;box-shadow:0 6px 0 #0a7186,0 0 26px rgba(25,227,255,.8)}
.cell.line::after{color:#032a33}
.chip{background:#1c1760;border:2px solid var(--a);color:var(--a);box-shadow:0 3px 0 #0a0720}
.chip:disabled{background:#120f3a;border-color:#2b2679;color:#5b54b0;box-shadow:none}
.fields .field{background:#0a0720;border:3px solid var(--line)}
.field small{color:var(--muted)}
.field b{color:var(--ink)}
.field.act{border-color:var(--b);box-shadow:0 0 16px rgba(255,207,51,.4)}
.field.act b{color:var(--b)}
.key{background:#1c1760;border:2px solid #3e37a0;color:var(--ink);box-shadow:0 4px 0 #0a0720}
.key:active{background:#2a2490;box-shadow:0 1px 0 #0a0720}
.key.minus{background:#3b3010;border-color:var(--b);color:var(--b)}
.key.del{background:#2a1650;border-color:#5a3aa0}
.msg.ok{background:#0f3b32;color:var(--ok);border:2px solid var(--ok)}
.msg.warn{background:#3b3010;color:var(--b);border:2px solid var(--b)}
.msg.bad{background:#4a1230;color:var(--bad);border:2px solid var(--bad)}
.ov{background:rgba(5,3,25,.82)}
.modal{background:var(--card);color:var(--ink);border:3px solid var(--a);box-shadow:0 0 40px rgba(25,227,255,.45)}
.modal.win{background:linear-gradient(160deg,#3a1d8f,#6a2fd0);border-color:var(--b);box-shadow:0 0 50px rgba(255,207,51,.55)}
.win .big{color:var(--b);text-shadow:0 4px 0 #a56a00,0 0 28px rgba(255,207,51,.8)}
.win .btn{background:linear-gradient(#ffe066,#ffb703);color:#2a1a00}
.win.full{background:linear-gradient(160deg,#0b5a8f,#2a2490)}
.win.full .btn{color:#2a1a00}
/* teacher */
.t-task{background:var(--card);border:3px solid var(--a);box-shadow:0 0 30px rgba(25,227,255,.25)}
.t-num{color:var(--b);text-shadow:0 0 14px rgba(255,207,51,.6)}
.t-lv{font-weight:900;letter-spacing:3px;font-size:16px;color:var(--a);margin-bottom:4px}
.t-expr{color:#fff;text-shadow:0 0 18px rgba(25,227,255,.45)}
.t-ans{color:var(--b);text-shadow:0 0 18px rgba(255,207,51,.7);animation:ansPop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes ansPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.timer{height:14px;background:#0a0720;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 12px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5d7a,#ffcf33 45%,#35f2a0);transform-origin:left;animation:drain 30s linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.slide{background:var(--card);border:2px solid var(--line)}
.slide h2{color:var(--b);text-shadow:0 0 16px rgba(255,207,51,.55)}
.slide p{color:var(--ink)}
.mc{background:#1c1760;border:3px solid #3e37a0;color:var(--ink);box-shadow:0 4px 0 #0a0720}
.mc.d{background:radial-gradient(circle at 35% 28%,#fff3b0,#ffcf33 55%,#e09a00);color:#3a2300;border-color:#ffe38a}
.mc.h{background:radial-gradient(circle at 35% 28%,#e9fdff,#6af2ff 50%,#12b8d6);color:#032a33;border-color:#c9fbff}
.cap{color:var(--muted)}
.dots span{background:var(--line)}.dots span.on{background:var(--b);box-shadow:0 0 10px rgba(255,207,51,.8)}
.qr{background:#fff;padding:10px;border-radius:14px;box-shadow:0 0 30px rgba(25,227,255,.5)}
.chips.wide .chip{border-color:var(--a)}
@media (max-height:800px) and (min-width:700px){.slide{gap:8px;padding:8px 12px}.slide h2{font-size:clamp(24px,3.2vw,36px)}.slide p{font-size:clamp(16px,1.9vw,24px)}.mc{font-size:28px;aspect-ratio:5/3}.mg{width:240px}.two .mg{width:190px!important}.chip{padding:8px 0;font-size:17px}.msg{padding:8px 12px;font-size:17px;margin-bottom:6px}.t-expr{font-size:84px}}.tools{display:flex;gap:8px}#fshint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3b3010;color:var(--b);border:2px solid var(--b);border-radius:14px;padding:12px 18px;font-weight:800;z-index:50;max-width:90vw;text-align:center}
/* ===== teacher: fill the whole screen + randomizer ball ===== */
#app.teacher{max-width:none;width:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app.teacher .top,#app.teacher .stat,#app.teacher .nav,#app.teacher .timer,#app.teacher .row,#app.teacher>.btn{flex:none}
#app.teacher .slide,#app.teacher .t-task{flex:1;min-height:0}
.ball{width:min(60vw,46vh);height:min(60vw,46vh);border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff8cc,#ffcf33 45%,#e09a00 82%);box-shadow:0 0 60px rgba(255,207,51,.6),inset -10px -14px 30px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;animation:ballShake .18s infinite}
.ball i{width:62%;height:62%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:min(22vw,17vh);font-weight:900;color:#3a2300;box-shadow:inset 0 -6px 14px rgba(0,0,0,.18)}
.drum.land .ball{animation:ballLand .6s cubic-bezier(.3,1.6,.5,1)}
.t-hint{color:var(--a);letter-spacing:4px;font-weight:900;text-transform:uppercase;margin-top:2vh;text-shadow:0 0 12px rgba(25,227,255,.6)}
@keyframes ballShake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-6px,4px) rotate(-3deg)}50%{transform:translate(5px,-5px) rotate(2deg)}75%{transform:translate(-4px,-3px) rotate(3deg)}}
@keyframes ballLand{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.reveal .t-expr{animation:reveal .55s cubic-bezier(.3,1.5,.5,1) both}
.reveal .t-num{animation:ansPop .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes reveal{from{opacity:0;transform:scale(.55) rotate(-2deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@media (min-width:700px){

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.

/* ===== Хранилище (с запасным вариантом, если localStorage недоступен) ===== */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return k in mem?JSON.parse(mem[k]):null; } },
  set(k,v){ const s=JSON.stringify(v); try{ localStorage.setItem(k,s);}catch(e){ mem[k]=s; } },
  del(k){ try{ localStorage.removeItem(k);}catch(e){ delete mem[k]; } }
};

const mn = n => String(n).replace("-","−");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save = () => store.set(KEY,S);
const p2=n=>String(n).padStart(2,"0");
const clock = ts => { const d=new Date(ts); return p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+d.getFullYear()+" "+p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds()); };

function winLine(){ // возвращает первую завершённую линию или null
  for(const L of LINES) if(L.every(i=>S.marked[i])) return L; return null;
}
function allLines(){ const out=new Set(); for(const L of LINES) if(L.every(i=>S.marked[i])) L.forEach(i=>out.add(i)); return out; }

/* ===== Рендер выражений ===== */
function renderExpr(src){
  const parts=[]; let last=0; const re=/\{([^|}]+)\|([^}]+)\}/g; let m;
  const plain = s => esc(s).replace(/-/g,"−").replace(/\*/g,"·").replace(/\./g,",");
  while((m=re.exec(src))){
    parts.push(plain(src.slice(last,m.index)));
    let num=m[1], sign="";
    if(num[0]==="-"){ sign="−"; num=num.slice(1); }
    parts.push(sign+'<span class="fr"><span>'+plain(num)+'</span><span>'+plain(m[2])+'</span></span>');
    last=re.lastIndex;
  }
  parts.push(plain(src.slice(last)));
  return parts.join("");
}


/* ===== Звук (по умолчанию выключен), вибрация, очки ===== */
let soundOn = store.get("bingo6v_snd")===true, AC=null;
function sfx(k){
  if(!soundOn) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,.08],[880,.12]],bad:[[220,.16],[150,.22]],win:[[523,.11],[659,.11],[784,.11],[1047,.34]],on:[[600,.06],[900,.08]],tick:[[950,.025]],land:[[523,.09],[784,.16]]}[k]; let tt=AC.currentTime;
    seq.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=(k==="bad")?"sawtooth":"square"; o.frequency.value=f;
      g.gain.setValueAtTime(.05,tt); g.gain.exponentialRampToValueAtTime(.001,tt+d); o.connect(g); g.connect(AC.destination); o.start(tt); o.stop(tt+d); tt+=d; });
  }catch(e){}
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
const lvOf = n => n<=20?1:(n<=50?2:3);
function stats(){
  let xp=0, streak=0; const tr=S.tried||{};
  for(let n=1;n<=BANK.length;n++){ const v=tr[n]; if(v===undefined) continue;
    if(v===null){ streak=0; continue; }
    if(v===BANK[n-1].a){ streak++; xp+=10+Math.min(streak,5)*2; } else streak=0; }
  xp+=50*S.marked.filter(Boolean).length+(S.b1?150:0)+(S.full?300:0);
  return {xp,streak};
}

const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;

function toggleFs(){
  try{
    if(fsOn()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    const el=document.documentElement, f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!f){ fsHint(); return; }
    const r=f.call(el); if(r&&r.catch) r.catch(fsHint);
  }catch(e){ fsHint(); }
}
function fsHint(){

function confetti(){
  const old=document.getElementById("confetti"); if(old) old.remove();
  const c=document.createElement("canvas"); c.id="confetti"; document.body.appendChild(c);
  const W=c.width=innerWidth, H=c.height=innerHeight, g=c.getContext("2d");
  const col=["#19e3ff","#ffcf33","#ffffff","#ff3d9a","#35f2a0","#8a6bff"];
  const P=Array.from({length:150},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,r:5+Math.random()*7,vx:-2+Math.random()*4,vy:2+Math.random()*4,a:Math.random()*6,va:-.2+Math.random()*.4,c:col[Math.floor(Math.random()*col.length)]}));
  const t0=performance.now();
  (function f(now){ const dt=now-t0; g.clearRect(0,0,W,H);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=p.va; g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.fillStyle=p.c; g.fillRect(-p.r,-p.r/2,p.r*2,p.r); g.restore(); });
    if(dt<3500) requestAnimationFrame(f); else c.remove(); })(t0);
}
function keypress(k){
  ui.fresh=null;
  const f="ans"; let v=ui[f];
  if(k==="del") v=v.slice(0,-1);
  else if(k==="-"){ if(f==="ans") v = v.startsWith("-")?v.slice(1):"-"+v; }
  else { const digits=v.replace("-",""); if(digits.length<(f==="task"?2:2)) v+=k; if(f==="ans" && v.replace("-","").length===0) v=""; }
  // не допускать ведущих нулей вида 05
  if(/^-?0\d/.test(v)) v=v.replace(/^(-?)0+(\d)/,"$1$2");
  ui[f]=v; ui.msg=null; render();
}

function submit(){
  if(S.cur>BANK.length) return;
  if(ui.ans===""||ui.ans==="-"){ ui.msg={k:"warn",t:t("needAns")}; render(); return; }
  ui.modal="send"; render();
}
function doSend(){
  const n=S.cur, val=parseInt(ui.ans,10), task=BANK[n-1], xp0=stats().xp;
  ui.modal=null; ui.ans="";
  S.tried=S.tried||{}; S.tried[n]=val; S.cur=n+1; save();          // попытка израсходована, переход к следующей
  const gain=()=>" +"+(stats().xp-xp0)+" "+t("xp");
  if(val!==task.a){ ui.msg={k:"bad",t:t("wrong")}; sfx("bad"); buzz([120,60,120]); render(); return; }
  const idx=S.cells.indexOf(val);
  if(idx<0){ ui.msg={k:"warn",t:t("okNot")+gain()}; sfx("ok"); render(); return; }
  if(S.marked[idx]){ ui.msg={k:"warn",t:t("okAlready")+gain()}; sfx("ok"); render(); return; }
  S.marked[idx]=true; S.solved[n]=val; ui.fresh=idx;
  const now=Date.now(); let pop=null;
  if(!S.b1 && winLine()){ S.b1=now; pop="bingo"; }
  if(!S.full && S.marked.every(Boolean)){ S.full=now; pop="full"; }
  save(); ui.msg={k:"ok",t:t("okMarked")+gain()}; buzz(60);
  if(pop){ ui.modal=pop; ui.confetti=true; sfx("win"); buzz([80,40,80,40,200]); } else sfx("ok");
  render();
}

function modalSend(){ return `<div class="ov"><div class="modal"><h2>${t("sendQ")}</h2>
  <div style="font-size:26px;font-weight:800;margin:6px 0">${t("taskNo")} ${S.cur} · ${t("ansIs")}: ${mn(ui.ans)}</div><p>${t("sendTxt")}</p>
  <button id="m-send" class="btn alt">${t("sendYes")}</button><div style="height:10px"></div><button id="m-no" class="btn ghost">${t("edit")}</button></div></div>`; }

/* ===== Режим учителя (экран для проектора) ===== */
let TS = store.get(KEYT) || null;
function newTeacher(order,url){
  return {v:3, mode:"slides", slide:0, url:(url==null?"https://natiyev.github.io/bingo-6v/":url), order:order||"seq", queue:BANK.map((_,i)=>i+1), cur:null, shown:[], ans:false};
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function reorder(){ TS.queue = TS.order==="rnd" ? shuffle(TS.queue.slice()) : TS.queue.slice().sort((x,y)=>x-y); }
const SAMPLE=[-5,0,3,-2,7,10,-9,4,1];
function miniGrid(arr,hi,done){
  hi=hi||[]; done=done||[];
  return '<div class="mg">'+arr.map((v,i)=>`<div class="mc ${done.includes(i)?"d":""} ${hi.includes(i)?"h":""}">${v===null?"?":mn(v)}</div>`).join("")+'</div>';
}
const SL_TXT = {
  ru:{
    s0:["Бинго: рациональные числа","6В · математика","Играем на телефонах. Решай задачи в тетради, отмечай числа в своей таблице."],
    s1:["Шаг 1. Открой ссылку","Введи своё имя и нажми «Начать»."],
    s2:["Шаг 2. Выбери 9 разных чисел","Нажми на ячейку, потом на число. Числа не повторяются."],
    s3:["Шаг 3. Подтверди таблицу","После подтверждения таблицу изменить нельзя, даже если закрыть страницу. Подумай заранее!"],
    s4:["Шаг 4. Решай и вводи ответ","На экране появится задача с номером. Реши в тетради, введи номер задачи и ответ."],
    s4b:"Каждую задачу можно сдать только ОДИН РАЗ. Только по порядку: назад нельзя. Проверь ответ перед отправкой!",
    s5:["Что будет после ответа"],
    s6:["Как победить","Бинго №1: три отмеченные ячейки подряд (строка, столбец или диагональ). Бинго №2: заполнена вся таблица. После первого бинго играй дальше!"],
    s6b:"Покажи экран «Бинго!» учителю. Решения должны быть в тетради.",
    s7:["Готовы?","Начинаем!"],
    go:"Начать задачи", urlPh:"Вставьте ссылку для учеников", rules:"К правилам", back:"Назад", fwd:"Далее", expl:"Правила"
  },
  kk:{
    s0:["Бинго: рационал сандар","6В · математика","Телефонмен ойнаймыз. Есептерді дәптерде шығар, сандарды өз кестеңде белгіле."],
    s1:["1-қадам. QR-кодты сканерле","Сілтеме ашылған соң есімінді жазып, «Бастау» батырмасын бас."],
    s2:["2-қадам. 9 түрлі сан таңда","Ұяшықты, содан кейін санды бас. Сандар қайталанбайды."],
    s3:["3-қадам. Кестені растау","Растағаннан кейін кестені өзгертуге болмайды, бетті жапсаң да. Алдын ала ойлан!"],
    s4:["4-қадам. Шығар да жауабын енгіз","Экранда есеп шығады, телефоныңда да сол нөмір тұрады. Дәптерде шығарып, тек жауабын енгіз. Жібергеннен кейін телефон келесі есепке өзі өтеді."],
    s4b:"Әр есепті тек БІР РЕТ тапсыруға болады, артқа қайтуға болмайды. Жібермес бұрын жауабыңды тексер!",
    s5:["Жауаптан кейін не болады"],
    s6:["Қалай жеңуге болады","1-бинго: қатарынан үш белгіленген ұяшық (жол, баған немесе диагональ). 2-бинго: бүкіл кесте толады. Бірінші бингодан кейін ойынды жалғастыр!"],
    s6b:"«Бинго!» экранын мұғалімге көрсет. Шешімдер дәптерде болуы керек.",
    s7:["Дайынсыңдар ма?","Бастаймыз!"],
    go:"Есептерді бастау", urlPh:"Оқушыларға арналған сілтемені қойыңыз", rules:"Ережеге", back:"Артқа", fwd:"Әрі қарай", expl:"Ереже"
  }
};
const NSLIDES=8;
function slideHtml(i){
  const x=SL_TXT[lang];
  switch(i){
    case 0: return `<h2>${x.s0[0]}</h2><p style="color:var(--a);font-weight:800">${x.s0[1]}</p><p>${x.s0[2]}</p>${miniGrid(SAMPLE,[],[1,4,8])}`;
    case 1: return `<h2>${x.s1[0]}</h2><div id="qr" class="qr"></div><input id="urlin" class="text urlin" type="text" inputmode="url" placeholder="${x.urlPh}" value="${esc(TS.url)}"><p>${x.s1[1]}</p>`;
    case 2: return `<h2>${x.s2[0]}</h2>${miniGrid([-5,0,3,null,null,null,null,null,null])}
      <div class="chips wide">${NUMS.map(n=>`<span class="chip" style="${[-5,0,3].includes(n)?"background:#f1f2f7;color:#c0c5d6;border-color:var(--line)":""}">${mn(n)}</span>`).join("")}</div><p>${x.s2[1]}</p>`;
    case 3: return `<h2>${x.s3[0]}</h2>${miniGrid(SAMPLE)}<p>${x.s3[1]}</p>`;
    case 4: return `<h2>${x.s4[0]}</h2>
      <div class="fields" style="width:min(100%,520px)"><div class="field"><small>${t("taskNo")}</small><b>12</b></div><div class="field"><small>${t("answer")}</small><b>−5</b></div></div>
      <p>${x.s4[1]}</p><p style="color:var(--b);font-weight:900">${x.s4b}</p>`;
    case 5: return `<h2>${x.s5[0]}</h2><div style="width:min(100%,700px)">
      <div class="msg ok">✓ ${t("okMarked")}</div><div class="msg warn">${t("okNot")}</div><div class="msg bad">${t("wrong")}</div></div>`;
    case 6: return `<h2>${x.s6[0]}</h2><div class="two">
      <div>${miniGrid(SAMPLE,[0,1,2],[0,1,2])}<p class="cap">1</p></div><div>${miniGrid(SAMPLE,[],[0,1,2,3,4,5,6,7,8])}<p class="cap">2</p></div></div>
      <p>${x.s6[1]}</p><p style="color:var(--a);font-weight:800">${x.s6b}</p>`;
    default: return `<h2>${x.s7[0]}</h2><p style="font-size:clamp(34px,6vw,72px);font-weight:900;color:var(--b)">${x.s7[1]}</p><button id="gotasks" class="btn alt" style="max-width:420px">${x.go}</button>`;
  }
}
function viewTeacher(){
  if(!TS || TS.v!==3){ TS=newTeacher(); store.set(KEYT,TS); }
  $app.classList.add("teacher");
  const saveT=()=>store.set(KEYT,TS);
  if(TS.mode==="slides"){
    const i=TS.slide, x=SL_TXT[lang];
    $app.innerHTML = shell(`<div class="slide">${slideHtml(i)}</div>
      <div class="nav"><button id="sp" class="btn ghost small" ${i===0?"disabled":""}>◀ ${x.back}</button>
      <div class="dots">${Array.from({length:NSLIDES},(_,k)=>`<span class="${k===i?"on":""}"></span>`).join("")}</div>
      <button id="sn" class="btn small" ${i===NSLIDES-1?"disabled":""}>${x.fwd} ▶</button></div>
      <div style="height:10px"></div><button id="skipr" class="btn ghost small">${x.go} →</button>`);
    bindCommon();
    const go=()=>{ TS.mode="tasks"; saveT(); render(); };
    document.getElementById("sp").onclick=()=>{ if(TS.slide>0){ TS.slide--; saveT(); render(); } };
    document.getElementById("sn").onclick=()=>{ if(TS.slide<NSLIDES-1){ TS.slide++; saveT(); render(); } };
    document.getElementById("skipr").onclick=go;
    const g=document.getElementById("gotasks"); if(g) g.onclick=go;
    const u=document.getElementById("urlin"); if(u){ const draw=()=>{ const q=document.getElementById("qr"); if(!q) return; q.innerHTML="";
        if(!TS.url) return; try{ const c=qrcode(0,"M"); c.addData(TS.url); c.make(); q.innerHTML=c.createSvgTag({cellSize:6,margin:2,scalable:true}); }catch(e){} };
      draw(); u.oninput=()=>{ TS.url=u.value.trim(); saveT(); draw(); }; }
    return;
  }
  const cur = TS.cur ? BANK[TS.cur-1] : null;
  let body; const rv=reveal; reveal=false;
  if(spin){
    body=`<div class="t-task drum"><div class="t-lv">${t("lv")} ${lvOf(TS.cur)}</div><div class="ball"><i id="drum">?</i></div><div class="t-hint">${t("spinTxt")}</div></div>`;
  } else if(cur){
    const el=Math.min(30,Math.max(0,(Date.now()-(TS.t0||Date.now()))/1000));
    body=`<div class="t-task ${rv?"reveal":""}"><div class="t-lv">${t("lv")} ${lvOf(TS.cur)}</div><div class="t-num">№ ${TS.cur}</div><div class="t-expr">${renderExpr(cur.e)}&nbsp;=&nbsp;?</div>
      ${TS.ans?`<div class="t-ans">${mn(cur.a)}</div>`:""}</div><div class="timer"><i style="animation-delay:-${el.toFixed(2)}s"></i></div>`;
  } else {
    body=`<div class="t-task"><div class="muted" style="font-size:26px">${TS.queue.length?t("tStart"):t("tEnd")}</div></div>`;
  }
  $app.innerHTML = shell(`
    <div class="stat"><span>${t("tMode")}</span><span>${t("shown")}: ${TS.shown.length} · ${t("left")}: ${TS.queue.length}</span></div>
    ${body}
    <button id="nx" class="btn" ${TS.queue.length?"":"disabled"}>${t("next")}</button><div style="height:10px"></div>
    <div class="row"><button id="sa" class="btn alt small" ${cur&&!spin?"":"disabled"}>${t("showAns")}</button><button id="sk" class="btn ghost small" ${cur&&!spin?"":"disabled"}>${t("skip")}</button></div>
    <div style="height:14px"></div><div class="row"><button id="rl" class="btn ghost small">${SL_TXT[lang].rules}</button><button id="tr" class="btn ghost small">${t("tReset")}</button></div>
    ${ui.modal==="treset"?`<div class="ov"><div class="modal"><h2>${t("tResetQ")}</h2><button id="m-ty" class="btn alt">${t("restartYes")}</button><div style="height:10px"></div><button id="m-no" class="btn ghost">${t("cancel")}</button></div></div>`:""}`);
  bindCommon();
  document.getElementById("nx").onclick=nextTask;
  document.getElementById("sa").onclick=()=>{ TS.ans=true; saveT(); render(); };
  document.getElementById("sk").onclick=()=>{ TS.cur=null; TS.ans=false; saveT(); render(); };
  document.getElementById("rl").onclick=()=>{ TS.mode="slides"; TS.slide=0; saveT(); render(); };
  document.getElementById("tr").onclick=()=>{ ui.modal="treset"; render(); };
  const ty=document.getElementById("m-ty"); if(ty) ty.onclick=()=>{ ui.modal=null; TS=newTeacher("seq",TS.url); TS.mode="tasks"; store.set(KEYT,TS); render(); };
  const tn=document.getElementById("m-no"); if(tn) tn.onclick=()=>{ ui.modal=null; render(); };
}
let spin=null, reveal=false;
function nextTask(){
  if(spin){ finishSpin(); return; }
  if(!TS.queue.length) return;
  TS.cur=TS.queue.shift(); TS.shown.push(TS.cur); TS.ans=false; TS.t0=null; store.set(KEYT,TS);
  startSpin();
}
function startSpin(){
  spin={timer:null}; render();
  const total=24; let i=0;
  const step=()=>{
    if(!spin) return;
    const d=document.getElementById("drum"); i++;
    if(i<total){
      if(d) d.textContent=1+Math.floor(Math.random()*BANK.length);
      sfx("tick");
      spin.timer=setTimeout(step, 45+Math.pow(i/total,3)*300);
    } else {
      if(d){ d.textContent=TS.cur; d.parentNode.parentNode.classList.add("land"); }
      sfx("land");
      spin.timer=setTimeout(finishSpin, 750);
    }
  };
  step();
}
function finishSpin(){
  if(!spin) return; clearTimeout(spin.timer); spin=null; reveal=true;
  TS.t0=Date.now(); store.set(KEYT,TS); render();
}
if(MODE==="teacher") document.addEventListener("keydown",e=>{
  if(!TS || e.target.tagName==="INPUT") return;
  const k=e.key;
  if(k==="f"||k==="F"){ toggleFs(); return; }
  if(TS.mode==="slides"){
    if((k==="ArrowRight"||k===" "||k==="Enter") && TS.slide<NSLIDES-1){ TS.slide++; store.set(KEYT,TS); render(); e.preventDefault(); }
    else if(k==="ArrowLeft" && TS.slide>0){ TS.slide--; store.set(KEYT,TS); render(); }
  } else {
    if(k==="ArrowRight"||k===" "||k==="Enter"||k==="n"){ nextTask(); e.preventDefault(); }
    else if((k==="a"||k==="A") && TS.cur && !spin){ TS.ans=!TS.ans; store.set(KEYT,TS); render(); }
    else if((k==="s"||k==="S") && TS.cur && !spin){ TS.cur=null; TS.ans=false; store.set(KEYT,TS); render(); }
  }
});

/* ===== Главный рендер ===== */
function render(){
  document.documentElement.lang = lang==="kk"?"kk":"ru";
  document.title = t("title");
  $app.classList.remove("teacher");
  if(isTeacher()) return viewTeacher();
  if(!S) return viewName();
  if(!S.locked) return viewPick();
  return viewPlay();
}
render();
</script>
</body>
